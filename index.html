<main id="app">

<!-- GAME PICKER -->
<section id="hub" class="screen is-on" aria-label="Juegos" data-i18n-aria="hub.aria">
  <header class="hero"><div class="wrap hub-head">
    <h1 class="hero__title display" id="title">PUZZLES GO</h1>
    <div class="hub-tools">
      <button class="icon-btn hub-progress glass" data-action="open-app-settings" aria-label="Ajustes" data-i18n-aria="common.settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
      <button class="icon-btn hub-progress glass" data-action="open-progress" aria-label="Progreso" data-i18n-aria="common.progress"><svg viewBox="0 0 24 24"><use href="#i-chart"/></svg></button>
    </div>
  </div></header>
  <!-- the last unfinished game, if any (ui/hub-view.js#resumeCard) -->
  <div class="wrap" id="resumeLast"></div>
  <div class="wrap"><p class="menu__label" data-i18n="hub.choose">Elige un juego</p></div>
  <!-- only the list scrolls; the title and "Choose a game" stay fixed -->
  <div class="hub-list"><div class="wrap"><div id="games"></div></div></div>
</section>

<!-- A GAME'S MENU -->
<section id="levels" class="screen" aria-label="Niveles" data-i18n-aria="menu.aria">
  <header class="hero"><div class="wrap">
    <h1 class="hero__title display" id="gameTitle"></h1>
  </div></header>
  <div class="wrap menu">
    <div id="resume"></div>
    <p class="menu__label" id="levelsLabel">Nueva partida</p>
    <div class="levels" id="levelList"></div>
    <nav class="dock glass">
      <button class="back-pill" data-action="back"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg><span data-i18n="common.games">Juegos</span></button>
      <div class="dock__actions">
        <button class="icon-btn" data-action="open-progress" aria-label="Progreso de este juego" data-i18n-aria="menu.gameProgress"><svg viewBox="0 0 24 24"><use href="#i-chart"/></svg></button>
        <button class="icon-btn" data-action="open" data-target="settings" aria-label="Ajustes" data-i18n-aria="common.settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
        <button class="icon-btn" data-action="open" data-target="help" aria-label="Cómo se juega" data-i18n-aria="common.help"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg></button>
      </div>
    </nav>
  </div>
</section>

<!-- A LEVEL'S BOARD TABLE (games with a picker, e.g. Pentominoes) -->
<section id="pick" class="screen" aria-label="Elegir reto" data-i18n-aria="menu.pickAria">
  <header class="hero"><div class="wrap">
    <h1 class="hero__title display" id="pickTitle"></h1>
  </div></header>
  <div class="wrap menu">
    <div id="pickBody"></div>
    <nav class="dock glass">
      <button class="back-pill" data-action="back"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-back"/></svg><span id="pickBack">Niveles</span></button>
      <div class="dock__actions">
        <button class="icon-btn" data-action="open" data-target="settings" aria-label="Ajustes" data-i18n-aria="common.settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
        <button class="icon-btn" data-action="open" data-target="help" aria-label="Cómo se juega" data-i18n-aria="common.help"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg></button>
      </div>
    </nav>
  </div>
</section>

<!-- PROGRESS: a game with its levels (ui/progress-view.js) -->
<section id="progress" class="screen" aria-label="Progreso" data-i18n-aria="progress.aria">
  <!-- no other action than going back: the button goes next to the title, not in a bottom bar -->
  <header class="hero"><div class="wrap pg-head">
    <button class="icon-btn pg-back" data-action="back" aria-label="Volver" data-i18n-aria="common.back"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <h1 class="hero__title display" data-i18n="progress.title">PROGRESO</h1>
  </div></header>
  <div class="wrap menu menu--bare">
    <div id="progressBody"></div>
  </div>
</section>

<!-- A LEVEL'S PROGRESS -->
<section id="progress-level" class="screen" aria-label="Progreso de un nivel" data-i18n-aria="progress.levelAria">
  <header class="hero"><div class="wrap pg-head">
    <p class="pg-over" id="progressGame"></p>
    <button class="icon-btn pg-back" data-action="back" aria-label="Volver al progreso del juego" data-i18n-aria="progress.backGame"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <h1 class="hero__title display" id="progressLevelTitle"></h1>
  </div></header>
  <div class="wrap menu menu--bare">
    <div id="progressLevelBody"></div>
  </div>
</section>

<!-- Each game's screens are added here from js/games/<game>/templates.js -->
</main>

<!-- SETTINGS (each game declares its switches) -->
<div class="overlay" id="settings" role="dialog" aria-label="Ajustes" data-i18n-aria="common.settings" data-dismissable>
  <div class="sheet glass">
    <div class="sheet__body">
      <h2 class="display" data-i18n="common.settings">Ajustes</h2>
      <div id="settingsList"></div>
      <!-- app-wide setting (ui/night-mode.js) -->
      <label class="toggle"><div><b data-i18n="appSettings.night">Modo noche</b><span data-i18n="appSettings.nightDesc">Colores cálidos en toda la app, para jugar antes de dormir.</span></div><input type="checkbox" data-night-toggle></label>
      <button class="btn-danger" data-action="wipe-stats" data-i18n="settings.wipe">Borrar estadísticas</button>
    </div>
    <div class="sheet__foot"><button class="btn-primary" data-action="close" data-i18n="common.done">Listo</button></div>
  </div>
</div>

<!-- APP SETTINGS (picker): night mode and language -->
<div class="overlay" id="app-settings" role="dialog" aria-label="Ajustes" data-i18n-aria="common.settings" data-dismissable>
  <div class="sheet glass">
    <div class="sheet__body">
      <h2 class="display" data-i18n="common.settings">Ajustes</h2>
      <label class="toggle"><div><b data-i18n="appSettings.night">Modo noche</b><span data-i18n="appSettings.nightDesc">Colores cálidos en toda la app, para jugar antes de dormir.</span></div><input type="checkbox" data-night-toggle></label>
      <label class="toggle"><div><b data-i18n="appSettings.language">Idioma</b><span data-i18n="appSettings.languageDesc">Por defecto, el del móvil.</span></div><select class="select" data-lang-select></select></label>
    </div>
    <div class="sheet__foot"><button class="btn-primary" data-action="close" data-i18n="common.done">Listo</button></div>
  </div>
</div>

<!-- HELP (each game provides the text) -->
<div class="overlay" id="help" role="dialog" aria-label="Cómo se juega" data-i18n-aria="common.help" data-dismissable>
  <div class="sheet glass">
    <div class="sheet__body">
      <h2 class="display" data-i18n="common.help">Cómo se juega</h2>
      <div id="helpBody"></div>
    </div>
    <div class="sheet__foot"><button class="btn-primary" data-action="close" data-i18n="help.gotIt">Entendido</button></div>
  </div>
</div>

<!-- GENERATING. It also covers the screen while the app starts (is-boot: just the logo, see js/app/app.js#start) -->
<div class="overlay is-on is-boot" id="loading" role="dialog" aria-label="Generando" data-i18n-aria="loading.aria">
  <div class="loader">
    <!-- the app icon: the gold piece slots into its gap again and again -->
    <svg class="loader__logo" viewBox="136 80 264 372" aria-hidden="true"><g class="loader__tiles"><rect x="150" y="94" width="100" height="100" rx="24"/><rect x="262" y="94" width="100" height="100" rx="24"/><rect x="150" y="206" width="100" height="100" rx="24"/><rect x="262" y="206" width="100" height="100" rx="24"/><rect x="150" y="318" width="100" height="100" rx="24"/></g><rect class="loader__piece" x="262" y="318" width="100" height="100" rx="24"/></svg>
    <p data-i18n="loading.title">Generando tablero</p>
    <small data-i18n="loading.text">Buscando uno con solución única y de la dificultad elegida.</small>
    <button class="btn-ghost" data-action="cancel-generation" data-i18n="common.cancel">Cancelar</button>
  </div>
</div>

<!-- CONFIRMATION -->
<div class="overlay" id="confirm" role="alertdialog" aria-labelledby="confirmTitle" aria-describedby="confirmText">
  <div class="card glass">
    <h2 class="display card__title" id="confirmTitle" data-confirm="title"></h2>
    <p class="card__sub" id="confirmText" data-confirm="text"></p>
    <button class="btn-primary" data-action="confirm-accept" data-confirm="accept"></button>
    <button class="btn-ghost" data-action="confirm-alternate" data-confirm="alternate"></button>
  </div>
</div>

<!-- SOLVED -->
<div class="overlay" id="win" role="dialog" aria-label="Tablero resuelto" data-i18n-aria="win.aria">
  <div class="card glass">
    <h2 class="display" data-i18n="win.title">Resuelto</h2>
    <div class="card__big" id="winTime">0:00</div>
    <div class="card__sub" id="winDetail"></div>
    <div id="winStrip"></div>
    <button class="btn-primary" data-action="next-puzzle" data-i18n="win.next">Siguiente tablero</button>
    <button class="btn-ghost" data-action="to-menu" data-i18n="common.menu">Menú</button>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

</body>
</html>
