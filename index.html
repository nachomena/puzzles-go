<main id="app">

<!-- SELECTOR DE JUEGOS -->
<section id="hub" class="screen is-on" aria-label="Juegos">
  <header class="hero"><div class="wrap">
    <h1 class="hero__title display" id="title">PUZZLES GO</h1>
  </div></header>
  <div class="wrap menu">
    <p class="menu__label">Elige un juego</p>
    <div id="games"></div>
    <hr class="rule">
    <button class="level game-card hub-progress" data-action="open-progress">
      <span class="level__text"><span class="level__name display">PROGRESO</span><span class="level__meta">Tus tiempos en cada juego</span></span>
      <span class="game-card__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#i-chart"/></svg></span>
    </button>
  </div>
</section>

<!-- MENÚ DE UN JUEGO -->
<section id="levels" class="screen" aria-label="Niveles">
  <header class="hero"><div class="wrap">
    <h1 class="hero__title display" id="gameTitle"></h1>
  </div></header>
  <div class="wrap menu">
    <div id="resume"></div>
    <p class="menu__label" id="levelsLabel">Nueva partida</p>
    <div id="levelList"></div>
    <hr class="rule">
    <nav class="menu__icons">
      <button class="icon-btn" data-action="back" aria-label="Volver a los juegos"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <button class="icon-btn" data-action="open-progress" aria-label="Progreso de este juego"><svg viewBox="0 0 24 24"><use href="#i-chart"/></svg></button>
      <button class="icon-btn" data-action="open" data-target="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
      <button class="icon-btn" data-action="open" data-target="help" aria-label="Cómo se juega"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg></button>
    </nav>
  </div>
</section>

<!-- TABLA DE TABLEROS DE UN NIVEL (juegos con picker, p. ej. Katamino) -->
<section id="pick" class="screen" aria-label="Elegir reto">
  <header class="hero"><div class="wrap">
    <h1 class="hero__title display" id="pickTitle"></h1>
  </div></header>
  <div class="wrap menu">
    <div id="pickBody"></div>
    <hr class="rule">
    <nav class="menu__icons">
      <button class="icon-btn" data-action="back" aria-label="Volver a los desafíos"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
      <button class="icon-btn" data-action="open" data-target="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
      <button class="icon-btn" data-action="open" data-target="help" aria-label="Cómo se juega"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg></button>
    </nav>
  </div>
</section>

<!-- PROGRESO: un juego con sus niveles (ui/progress-view.js) -->
<section id="progress" class="screen" aria-label="Progreso">
  <header class="hero"><div class="wrap">
    <h1 class="hero__title display">PROGRESO</h1>
  </div></header>
  <div class="wrap menu">
    <div id="progressBody"></div>
    <hr class="rule">
    <nav class="menu__icons">
      <button class="icon-btn" data-action="back" aria-label="Volver"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    </nav>
  </div>
</section>

<!-- PROGRESO DE UN NIVEL -->
<section id="progress-level" class="screen" aria-label="Progreso de un nivel">
  <header class="hero"><div class="wrap">
    <p class="pg-over" id="progressGame"></p>
    <h1 class="hero__title display" id="progressLevelTitle"></h1>
  </div></header>
  <div class="wrap menu">
    <div id="progressLevelBody"></div>
    <hr class="rule">
    <nav class="menu__icons">
      <button class="icon-btn" data-action="back" aria-label="Volver al progreso del juego"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    </nav>
  </div>
</section>

<!-- Las pantallas de cada juego se añaden aquí desde js/games/<juego>/templates.js -->
</main>

<!-- AJUSTES (los interruptores los declara cada juego) -->
<div class="overlay" id="settings" role="dialog" aria-label="Ajustes" data-dismissable>
  <div class="sheet">
    <h2 class="display">Ajustes</h2>
    <div id="settingsList"></div>
    <button class="btn-danger" data-action="wipe-stats">Borrar estadísticas</button>
    <button class="btn-primary" data-action="close">Listo</button>
  </div>
</div>

<!-- AYUDA (el texto lo aporta cada juego) -->
<div class="overlay" id="help" role="dialog" aria-label="Cómo se juega" data-dismissable>
  <div class="sheet">
    <h2 class="display">Cómo se juega</h2>
    <div id="helpBody"></div>
    <button class="btn-primary" data-action="close">Entendido</button>
  </div>
</div>

<!-- GENERANDO -->
<div class="overlay" id="loading" role="dialog" aria-label="Generando">
  <div class="loader">
    <svg class="loader__spin" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
    <p>Generando tablero</p>
    <small>Buscando uno con solución única y de la dificultad elegida.</small>
    <button class="btn-ghost" data-action="cancel-generation">Cancelar</button>
  </div>
</div>

<!-- CONFIRMACIÓN -->
<div class="overlay" id="confirm" role="alertdialog" aria-labelledby="confirmTitle" aria-describedby="confirmText">
  <div class="card">
    <h2 class="display card__title" id="confirmTitle" data-confirm="title"></h2>
    <p class="card__sub" id="confirmText" data-confirm="text"></p>
    <button class="btn-primary" data-action="confirm-accept" data-confirm="accept"></button>
    <button class="btn-ghost" data-action="confirm-alternate" data-confirm="alternate"></button>
  </div>
</div>

<!-- RESUELTO -->
<div class="overlay" id="win" role="dialog" aria-label="Tablero resuelto">
  <div class="card">
    <h2 class="display">Resuelto</h2>
    <div class="card__big" id="winTime">0:00</div>
    <div class="card__sub" id="winDetail"></div>
    <div id="winStrip"></div>
    <button class="btn-primary" data-action="next-puzzle">Siguiente tablero</button>
    <button class="btn-ghost" data-action="to-menu">Menú</button>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

</body>
</html>
