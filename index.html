<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puzzles Go">
<meta name="theme-color" content="#232228">
<title>Puzzles Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/menu.css">
<link rel="stylesheet" href="css/play.css">
<link rel="stylesheet" href="css/overlays.css">
<link rel="stylesheet" href="css/games/star-battle.css">
<link rel="stylesheet" href="css/games/sudoku.css">
<script type="module" src="js/main.js"></script>
</head>
<body>

<!-- Sprite de iconos: se usan con <svg><use href="#i-nombre"/></svg> -->
<svg class="sprite" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><path d="M12 1.8l2.9 7 7.3.5-5.6 4.7 1.8 7.2L12 17.3l-6.2 3.9 1.8-7.2L2 9.3l7.3-.5z"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.8l2.75 5.9 6.45.75-4.78 4.4 1.28 6.37L12 17.05 6.3 20.22l1.28-6.37L2.8 9.45l6.45-.75z"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></symbol>
  <symbol id="i-brush" viewBox="0 0 24 24"><path d="M20.5 3.5c-2.8 1.6-6.4 4.8-9 7.7l1.3 1.3c2.9-2.6 6.1-6.2 7.7-9zM11.5 11.2l-1.7 1.9 1.1 1.1 1.9-1.7M9.8 13.1c-1.9-.3-3.6 1-3.9 2.9-.2 1.3-.9 2.3-2.4 2.8 2.8 1.6 6.6 1 7.4-2.6"/></symbol>
  <symbol id="i-reset" viewBox="0 0 24 24"><path d="M5.2 8.5A8 8 0 1 0 12 4H9.5M9.5 4l2.6-2.6M9.5 4l2.6 2.6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 5L4.5 9.5 9 14M4.5 9.5H15a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 5l4.5 4.5L15 14M19.5 9.5H9a5 5 0 0 0 0 10h3"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></symbol>
  <symbol id="i-hint" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v2.3M12 19.2v2.3M21.5 12h-2.3M4.8 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9L5.3 5.3"/><circle cx="12" cy="12" r="7.2"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><path d="M8.5 8.5a3.6 3.6 0 1 1 5.2 3.2c-1 .5-1.7 1.3-1.7 2.4v1"/><circle cx="12" cy="19.2" r=".4"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1.5"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18"/></symbol>
  <symbol id="i-number" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M10 8.6l2.4-1.6v10"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L15.8 4.8a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8zM14 6.6l3.4 3.4"/></symbol>
  <symbol id="i-erase" viewBox="0 0 24 24"><path d="M8.5 19.5l-4-4a2 2 0 0 1 0-2.8l8.2-8.2a2 2 0 0 1 2.8 0l4 4a2 2 0 0 1 0 2.8l-8 8.2zM8.5 19.5H20M9 8.2l6.8 6.8"/></symbol>
</svg>

<main id="app">

<!-- SELECTOR DE JUEGOS -->
<section id="hub" class="screen is-on" aria-label="Juegos">
  <header class="hero"><div class="wrap">
    <h1 class="hero__title display" id="title">PUZZLES GO</h1>
  </div></header>
  <div class="wrap menu">
    <p class="menu__label">Elige un juego</p>
    <div id="games"></div>
  </div>
</section>

<!-- MENÚ DE UN JUEGO -->
<section id="levels" class="screen" aria-label="Niveles">
  <header class="hero hero--game"><div class="wrap">
    <button class="icon-btn hero__back" data-action="back" aria-label="Volver a los juegos"><svg viewBox="0 0 24 24"><use href="#i-back"/></svg></button>
    <h1 class="hero__title display" id="gameTitle"></h1>
  </div></header>
  <div class="wrap menu">
    <div id="resume"></div>
    <p class="menu__label">Nueva partida</p>
    <div id="levelList"></div>
    <hr class="rule">
    <nav class="menu__icons">
      <button class="icon-btn" data-action="open" data-target="settings" aria-label="Ajustes"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
      <button class="icon-btn" data-action="open" data-target="help" aria-label="Cómo se juega"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg></button>
    </nav>
  </div>
</section>

<!-- Las pantallas de cada juego se añaden aquí desde js/games/<juego>/templates.js -->
</main>

<!-- AJUSTES (los interruptores los declara cada juego) -->
<div class="overlay" id="settings" role="dialog" aria-label="Ajustes" data-dismissable>
  <div class="sheet">
    <h2 class="display">Ajustes</h2>
    <div id="settingsList"></div>
    <button class="btn-danger" data-action="wipe-stats">Borrar estadísticas</button>
    <button class="btn-primary" data-action="close">Listo</button>
  </div>
</div>

<!-- AYUDA (el texto lo aporta cada juego) -->
<div class="overlay" id="help" role="dialog" aria-label="Cómo se juega" data-dismissable>
  <div class="sheet">
    <h2 class="display">Cómo se juega</h2>
    <div id="helpBody"></div>
    <button class="btn-primary" data-action="close">Entendido</button>
  </div>
</div>

<!-- GENERANDO -->
<div class="overlay" id="loading" role="dialog" aria-label="Generando">
  <div class="loader">
    <svg class="loader__spin" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-logo"/></svg>
    <p>Generando tablero</p>
    <small>Buscando uno con solución única y de la dificultad elegida.</small>
    <button class="btn-ghost" data-action="cancel-generation">Cancelar</button>
  </div>
</div>

<!-- RESUELTO -->
<div class="overlay" id="win" role="dialog" aria-label="Tablero resuelto">
  <div class="card">
    <h2 class="display">Resuelto</h2>
    <div class="card__big" id="winTime">0:00</div>
    <div class="card__sub" id="winDetail"></div>
    <button class="btn-primary" data-action="next-puzzle">Siguiente tablero</button>
    <button class="btn-ghost" data-action="to-menu">Menú</button>
  </div>
</div>

<div id="toast" class="toast" role="status"></div>

</body>
</html>
