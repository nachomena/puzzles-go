<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Como icon.svg, reducido para que quepa en el círculo seguro de Android (80 %). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2b32"/><stop offset="1" stop-color="#1b1a1f"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".5" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity=".5"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0d27a"/><stop offset="1" stop-color="#d5a944"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256 256) scale(.82) translate(-264 -266)">
  <rect x="150" y="94" width="100" height="100" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="3"/>
  <rect x="262" y="94" width="100" height="100" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="3"/>
  <rect x="150" y="206" width="100" height="100" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="3"/>
  <rect x="262" y="206" width="100" height="100" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="3"/>
  <rect x="150" y="318" width="100" height="100" rx="24" fill="url(#glass)" stroke="url(#rim)" stroke-width="3"/>
  <!-- la pieza que falta, dorada, entrando girada en su hueco (centro del hueco: 312, 368) -->
  <rect x="262" y="318" width="100" height="100" rx="24" fill="url(#gold)" transform="translate(16 14) rotate(14 312 368)"/>
  </g>
</svg>
